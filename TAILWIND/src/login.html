<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="output.css">
    <title>Log in psge</title>
</head>

<body class="bg-gray-900 flex justify-center items-center min-h-screen  ">
    <div class="bg-slate-700 w-full max-w-md p-8 rounded-2xl shadow-2xl shadow-cyan-600">
        <form>
            <h2 class="text-center text-2xl mb-3 font-bold">Log In</h2>
            <div class="mb-5">
                <label class="block text-white mb-2 " for="">Email</label>
                <input class="w-full px-4 py-3 rounded-lg outline-none focus:ring-2 focus:ring-blue-500" type="email"
                    name="" placeholder="enter email" id="">
            </div>
            <div>
                <label class="block text-white mb-2" for="">password</label>
                <input class="w-full px-4 py-3 rounded-lg outline-none focus:ring-2 focus:ring-blue-500" type="password"
                    name="" placeholder="enter your password" id="">
            </div>

            <button
                class="w-full py-3 rounded-lg font-semibold hover:bg-blue-700 hover:scale-[1.02] transition duration-200"
                type="submit">login</button>

        </form>
    </div>
</body>

</html>
