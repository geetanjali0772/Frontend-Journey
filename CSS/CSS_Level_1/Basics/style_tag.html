<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Style tag</title>
    <!-- blue background color using style tag -->
    <style>
        button{
            background-color:blue;
        }
    </style>
</head>
<body>
    <h1>Use of style tag</h1>
    <button>click here</button>
</body>
</html>
